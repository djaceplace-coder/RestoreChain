<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tracefield" />
    <title>Tracefield | Digital Asset Recovery & Forensics</title>
    <meta name="description" content="Tracefield provides comprehensive blockchain forensics and digital asset recovery services." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0A0A0F" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: "en", autoDisplay: false}, "google_translate_element");
      }
      (function() {
        if (document.cookie.indexOf('googtrans=') !== -1) {
          var gt = document.createElement('script');
          gt.type = 'text/javascript';
          gt.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
          document.head.appendChild(gt);
        }
      })();
    </script>
    <style>
      body { top: 0px !important; position: static !important; }
      .goog-te-banner-frame { display: none !important; }
      .skiptranslate > iframe.goog-te-banner-frame { display: none !important; }
      #goog-gt-tt { display: none !important; }
      .goog-tooltip { display: none !important; }
      .goog-tooltip:hover { display: none !important; }
      .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
      /* Ensure nothing shifts the body down */
      html { height: 100%; }
    </style>
  </body>
</html>
